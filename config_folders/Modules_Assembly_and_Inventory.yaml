datasource_variable: DS_POSTGRES

dashboards:

  - title: "Module Info"
    panels:
      - title: "Module Info"
        table: "module_info"
        chart_type: "barchart"
        condition: "bp_material IS NOT NULL AND resolution IS NOT NULL AND roc_version IS NOT NULL AND geometry IS NOT NULL AND final_grade != 'F'"
        groupby: ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "shipped_datetime"]
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "shipping_status", "assembled"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]
      - title: "Module Shipping Status"
        table: "module_info"
        chart_type: "piechart"
        condition: "bp_material IS NOT NULL AND resolution IS NOT NULL AND roc_version IS NOT NULL AND geometry IS NOT NULL"
        groupby: []
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "shipping_status", "assembled"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]
      - title: "Not-Shipped Modules Info"
        table: "module_info"
        chart_type: "table"
        condition: "shipped_datetime IS NULL AND bp_material IS NOT NULL AND resolution IS NOT NULL AND roc_version IS NOT NULL AND geometry IS NOT NULL AND final_grade != 'F'"
        groupby: {"module_info": ["assembled", "module_name"], "module_qc_summary": ["final_grade", "proto_grade", "module_grade", "iv_grade", "readout_grade"]}
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "shipping_status", "assembled"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]

      - title: "Need Front Wirebond"
        table: "module_info"
        chart_type: "table"
        condition: "wb_front IS NULL AND final_grade != 'F'"
        groupby: {"module_info": ["module_name", "wb_front", "wb_back"]}
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "shipping_status", "assembled"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]
      - title: "Need Front Encapsulation"
        table: "module_info"
        chart_type: "table"
        condition: "encap_front IS NULL AND wb_front IS NOT NULL AND final_grade != 'F'"
        groupby: {"module_info": ["module_name", "encap_front", "encap_back"]}
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "shipping_status", "assembled"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]
      - title: "Need Electrical Test"
        table: "module_info"
        chart_type: "table"
        condition: "test_iv IS NULL AND wb_front IS NOT NULL AND final_grade != 'F'"
        groupby: {"module_info": [ "module_name", "test_iv", "test_ped"]}
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "shipping_status", "assembled"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]

  - title: "Module Inspect"
    panels:
      - title: "grade"
        table: "module_inspect"
        chart_type: "barchart"
        condition: "grade IS NOT NULL"
        groupby: ["grade"]
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "assembled", "wirebond_status", "shipping_status"], "module_inspect": ["grade"]}
        distinct: ["module_inspect", "module_info"]
      - title: "counts of grade A"
        table: "module_inspect"
        chart_type: "stat"
        condition: "(grade = 'A')"
        groupby: []
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "assembled", "wirebond_status", "shipping_status"], "module_inspect": ["grade"]}
        distinct: ["module_inspect", "module_info"]
      - title: "module inspect Info"
        table: "module_inspect"
        chart_type: "table"
        condition: "grade IS NOT NULL"
        groupby: {"module_inspect": ["module_name", "grade"]}
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "assembled", "wirebond_status", "shipping_status"], "module_inspect": ["grade"]}
        distinct: ["module_inspect", "module_info"]
      - title: "Flatness (mm)"
        table: "module_inspect"
        chart_type: "histogram"
        condition: "flatness IS NOT NULL"
        groupby: ["flatness"]
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "assembled", "wirebond_status", "shipping_status"], "module_inspect": ["grade"]}
        distinct: ["module_inspect", "module_info"]
      - title: "average thickness (mm)"
        table: "module_inspect"
        chart_type: "histogram"
        condition: "avg_thickness IS NOT NULL"
        groupby: ["avg_thickness"]
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "assembled", "wirebond_status", "shipping_status"], "module_inspect": ["grade"]}
        distinct: ["module_inspect", "module_info"]
      - title: "max thickness (mm)"
        table: "module_inspect"
        chart_type: "histogram"
        condition: "max_thickness IS NOT NULL"
        groupby: ["max_thickness"]
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "assembled", "wirebond_status", "shipping_status"], "module_inspect": ["grade"]}
        distinct: ["module_inspect", "module_info"]
      - title: "x offset (μm)"
        table: "module_inspect"
        chart_type: "histogram"
        condition: "x_offset_mu IS NOT NULL"
        groupby: ["x_offset_mu"]
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "assembled", "wirebond_status", "shipping_status"], "module_inspect": ["grade"]}
        distinct: ["module_inspect", "module_info"]
      - title: "y offset (μm)"
        table: "module_inspect"
        chart_type: "histogram"
        condition: "y_offset_mu IS NOT NULL"
        groupby: ["y_offset_mu"]
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "assembled", "wirebond_status", "shipping_status"], "module_inspect": ["grade"]}
        distinct: ["module_inspect", "module_info"]
      - title: "ang offset (deg)"
        table: "module_inspect"
        chart_type: "histogram"
        condition: "ang_offset_deg IS NOT NULL"
        groupby: ["ang_offset_deg"]
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "assembled", "wirebond_status", "shipping_status"], "module_inspect": ["grade"]}
        distinct: ["module_inspect", "module_info"]

  - title: "Proto Inspect"
    panels:
      - title: "grade"
        table: "proto_inspect"
        chart_type: "barchart"
        condition: "temp_table_0.grade IS NOT NULL"
        groupby: ["grade"]
        filters: {"baseplate": ["bp_material"], "sensor": ["thickness", "resolution", "geometry"], "proto_assembly": ["ass_run_date"], "proto_inspect": ["grade"], "module_info": ["shipping_status"]}
        distinct: ["proto_inspect", "baseplate", "sensor", "proto_assembly"]
      - title: "counts of grade A"
        table: "proto_inspect"
        chart_type: "stat"
        condition: "(temp_table_0.grade = 'A')"
        groupby: []
        filters: {"baseplate": ["bp_material"], "sensor": ["thickness", "resolution", "geometry"], "proto_assembly": ["ass_run_date"], "proto_inspect": ["grade"], "module_info": ["shipping_status"]}
        distinct: ["proto_inspect", "baseplate", "sensor", "proto_assembly"]
      - title: "proto module Info"
        table: "proto_inspect"
        chart_type: "table"
        condition: "temp_table_0.grade IS NOT NULL"
        groupby: {"proto_inspect": ["proto_name", "grade"]}
        filters: {"baseplate": ["bp_material"], "sensor": ["thickness", "resolution", "geometry"], "proto_assembly": ["ass_run_date"], "proto_inspect": ["grade"], "module_info": ["shipping_status"]}
        distinct: ["proto_inspect", "baseplate", "sensor", "proto_assembly"]
      - title: "Flatness (mm)"
        table: "proto_inspect"
        chart_type: "histogram"
        condition: "flatness IS NOT NULL"
        groupby: ["flatness"]
        filters: {"baseplate": ["bp_material"], "sensor": ["thickness", "resolution", "geometry"], "proto_assembly": ["ass_run_date"], "proto_inspect": ["grade"], "module_info": ["shipping_status"]}
        distinct: ["proto_inspect", "baseplate", "sensor", "proto_assembly"]
      - title: "average thickness (mm)"
        table: "proto_inspect"
        chart_type: "histogram"
        condition: "avg_thickness IS NOT NULL"
        groupby: ["avg_thickness"]
        filters: {"baseplate": ["bp_material"], "sensor": ["thickness", "resolution", "geometry"], "proto_assembly": ["ass_run_date"], "proto_inspect": ["grade"], "module_info": ["shipping_status"]}
        distinct: ["proto_inspect", "baseplate", "sensor", "proto_assembly"]
      - title: "max thickness (mm)"
        table: "proto_inspect"
        chart_type: "histogram"
        condition: "max_thickness IS NOT NULL"
        groupby: ["max_thickness"]
        filters: {"baseplate": ["bp_material"], "sensor": ["thickness", "resolution", "geometry"], "proto_assembly": ["ass_run_date"], "proto_inspect": ["grade"], "module_info": ["shipping_status"]}
        distinct: ["proto_inspect", "baseplate", "sensor", "proto_assembly"]
      - title: "x offset (μm)"
        table: "proto_inspect"
        chart_type: "histogram"
        condition: "x_offset_mu IS NOT NULL"
        groupby: ["x_offset_mu"]
        filters: {"baseplate": ["bp_material"], "sensor": ["thickness", "resolution", "geometry"], "proto_assembly": ["ass_run_date"], "proto_inspect": ["grade"], "module_info": ["shipping_status"]}
        distinct: ["proto_inspect", "baseplate", "sensor", "proto_assembly"]
      - title: "y offset (μm)"
        table: "proto_inspect"
        chart_type: "histogram"
        condition: "y_offset_mu IS NOT NULL"
        groupby: ["y_offset_mu"]
        filters: {"baseplate": ["bp_material"], "sensor": ["thickness", "resolution", "geometry"], "proto_assembly": ["ass_run_date"], "proto_inspect": ["grade"], "module_info": ["shipping_status"]}
        distinct: ["proto_inspect", "baseplate", "sensor", "proto_assembly"]
      - title: "ang offset (deg)"
        table: "proto_inspect"
        chart_type: "histogram"
        condition: "ang_offset_deg IS NOT NULL"
        groupby: ["ang_offset_deg"]
        filters: {"baseplate": ["bp_material"], "sensor": ["thickness", "resolution", "geometry"], "proto_assembly": ["ass_run_date"], "proto_inspect": ["grade"], "module_info": ["shipping_status"]}
        distinct: ["proto_inspect", "baseplate", "sensor", "proto_assembly"]

  - title: "Packed and Shipped Modules Info"  
    panels: 
      - title: "Total boxes"
        table: "module_info"
        chart_type: "stat"
        condition: "temp_table_0.box_number IS NOT NULL AND NOT EXISTS (SELECT 1 FROM module_info m2 WHERE m2.box_number = temp_table_0.box_number AND m2.module_no < temp_table_0.module_no)"
        groupby: []
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]
        count_distinct: ["box_number"]
      - title: "Number of full boxes"
        table: "module_info"
        chart_type: "stat"
        condition: "box_number IS NOT NULL AND (SELECT COUNT(*) FROM module_info m2 WHERE m2.box_number = temp_table_0.box_number) = 6 AND temp_table_0.position_in_box::integer = 6"
        groupby: []
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]
      - title: "Total modules packed"
        table: "module_info"
        chart_type: "stat"
        condition: "(packed_datetime IS NOT NULL AND box_number IS NOT NULL)"
        groupby: []
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]
      - title: "Unfilled boxes"
        table: "module_info"
        chart_type: "barchart"
        panels_per_row: 2
        condition: "box_number IS NOT NULL AND (SELECT COUNT(*) FROM module_info m2 WHERE m2.box_number = temp_table_0.box_number) < 6"
        groupby: ["box_number"]
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]
      - title: "Number of boxes with N modules"
        table: "module_info"
        chart_type: "histogram"
        panels_per_row: 2
        bucket_size: 1
        bucket_offset: 0.5
        condition: "temp_table_0.box_number IS NOT NULL AND temp_table_0.position_in_box::integer = (SELECT MAX(m2.position_in_box::integer)FROM module_info m2 WHERE m2.box_number = temp_table_0.box_number)"
        groupby: [{"position_in_box::integer * 0 + (SELECT COUNT(*) FROM module_info m2 WHERE m2.box_number = temp_table_0.box_number)": "number_of_boxes"}]
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]
      - title: "Packing and Shipping Info"
        table: "module_info"
        chart_type: "table"
        panels_per_row: 1
        condition: ""
        groupby: {"module_info": ["row_count", "module_name", "box_number", "packed_datetime", "shipped_datetime", "position_in_box", "shipment_number", "thermal_cycle_date", "thermal_cycle_count"], "module_qc_summary": ["final_grade"]}
        contains_inputs: {"module_info":["module_name", "box_number", "shipment_number", "position_in_box"]}
        filters: {"module_info": ["bp_material", "resolution", "roc_version", "sen_thickness", "geometry", "packing_and_shipping_status"], "module_qc_summary": ["final_grade"]}
        distinct: ["module_info", "module_qc_summary"]
        orderby: "module_no DESC"